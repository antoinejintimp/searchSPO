<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Recherche — Intranet</title>
<style>
* { box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

html, body {
  margin: 0;
  padding: 0;
  background: transparent; /* laisse voir la page hôte (SharePoint) derrière */
}

body {
  padding: 24px;
  font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  /* Réserve de la place pour le menu déroulant ouvert : si l'outil qui
     t'a embed la page mesure la hauteur du contenu pour dimensionner
     l'iframe, ça l'aide à prévoir large. Ça ne coûte rien : le fond est
     transparent, donc cet espace est invisible tant que le menu est fermé. */
  min-height: 230px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

:root {
  --navy-dark: #123047;   /* extrémité gauche de la barre */
  --navy-mid: #234a5c;    /* étape intermédiaire du dégradé */
  --navy-light: #3f6b76;  /* extrémité droite, avant la puce blanche */
  --navy-ink: #123047;    /* texte / ligne sélectionnée dans la liste */
  --lime: #c8db1f;        /* bouton de recherche */
  --lime-dark: #aec01a;
  --line: #e1e6ea;
  --muted: #74828f;
}

.search-bar {
  position: relative;
  max-width: 640px;
}

.search-bar__shell {
  display: flex;
  align-items: stretch;
  height: 66px;
  padding: 5px;
  gap: 6px;
  border-radius: 999px;
  background: linear-gradient(100deg, var(--navy-dark) 0%, var(--navy-mid) 55%, var(--navy-light) 100%);
  border: 1.5px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    inset 0 -14px 18px -14px rgba(0, 0, 0, 0.2),
    0 6px 10px rgba(18, 48, 71, 0.16),
    0 20px 36px -8px rgba(18, 48, 71, 0.32);
}

/* Le déclencheur et le bouton ne touchent plus les bords de la pilule :
   ce sont des puces rondes flottantes, avec un mince anneau de dégradé
   visible tout autour (padding du shell). C'est ce jeu d'arrondis
   "imbriqués" (pilule dans la pilule) qu'on voit sur le vrai bouton
   "Mon espace locataire" flottant dans la barre de nav du site, plutôt
   qu'une couture droite entre segments d'une seule forme continue. */
.search-bar__field {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 0 0 22px;
}

.search-bar__field svg {
  flex-shrink: 0;
  color: rgba(255, 255, 255, 0.92);
}

#searchInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: #fff;
  font-size: 15.5px;
  font-weight: 500;
  font-family: inherit;
  letter-spacing: 0.01em;
}

#searchInput::placeholder { color: rgba(255, 255, 255, 0.72); }

/* ---------- Sélecteur de moteur : déclencheur + liste custom ---------- */
.engine-trigger {
  flex-shrink: 0;
  min-width: 132px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 999px;
  background: linear-gradient(180deg, #ffffff 0%, #f7f9fa 100%);
  color: var(--navy-ink);
  border: none;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(18, 48, 71, 0.22);
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.engine-trigger:hover { background: linear-gradient(180deg, #ffffff 0%, #eef1f4 100%); }

.engine-trigger:focus-visible {
  outline: 2px solid var(--lime);
  outline-offset: -4px;
}

.engine-trigger svg {
  width: 13px;
  height: 13px;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  flex-shrink: 0;
}

.engine-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }

.search-bar__submit {
  position: relative;
  flex-shrink: 0;
  width: 56px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(165deg, #d4e63a 0%, var(--lime) 55%, var(--lime-dark) 100%);
  border: none;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(18, 48, 71, 0.22);
  transition: filter 0.2s ease, transform 0.15s ease;
}

.search-bar__submit:hover { filter: brightness(1.04); }
.search-bar__submit:active { transform: scale(0.95); }

/* Retour au clic : un anneau qui s'estompe + la loupe qui "déclenche",
   comme un obturateur. Un seul geste, déclenché une fois par soumission. */
.search-bar__submit::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: rgba(18, 48, 71, 0.35);
  opacity: 0;
  pointer-events: none;
}

.search-bar__submit.is-firing::after { animation: submit-ripple 0.5s ease-out; }
.search-bar__submit.is-firing svg { animation: submit-icon-pulse 0.4s ease-out; }

@keyframes submit-ripple {
  from { transform: scale(1); opacity: 0.45; }
  to { transform: scale(9); opacity: 0; }
}

@keyframes submit-icon-pulse {
  0% { transform: scale(1); }
  35% { transform: scale(0.8); }
  70% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.search-bar__submit:focus-visible { outline: 2px solid var(--navy-ink); outline-offset: -4px; }
.search-bar__submit svg { width: 20px; height: 20px; }

/* ---------- Liste déroulante custom (role="listbox") ---------- */
.engine-listbox {
  position: absolute;
  top: calc(100% + 10px);
  left: 0; /* recalculé en JS pour rester aligné sous le déclencheur */
  width: 138px;
  margin: 0;
  padding: 6px;
  list-style: none;
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow:
    0 4px 10px rgba(18, 48, 71, 0.12),
    0 24px 48px -12px rgba(18, 48, 71, 0.35);
  z-index: 20;
  opacity: 0;
  transform: translateY(-6px) scale(0.96);
  transform-origin: top center;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.2s;
}

.engine-listbox.is-open {
  opacity: 1;
  transform: translateY(0) scale(1);
  visibility: visible;
  pointer-events: auto;
}

.engine-option {
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--navy-ink);
  cursor: pointer;
  transition: background 0.15s ease;
}

.engine-option.is-focused { background: #eef1f4; }

.engine-option[aria-selected="true"] {
  background: var(--navy-ink);
  color: #fff;
}

/* Note de confidentialité : présente pour les lecteurs d'écran, invisible
   à l'écran pour rester fidèle à la maquette de référence. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
</head>
<body>

<form id="webSearchForm" class="search-bar" autocomplete="off">
  <div class="search-bar__shell">
    <div class="search-bar__field">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7.5"/>
        <line x1="20.5" y1="20.5" x2="16.4" y2="16.4"/>
      </svg>
      <input
        type="search"
        id="searchInput"
        placeholder="Rechercher..."
        maxlength="200"
        autocomplete="off"
        spellcheck="false"
        required
      />
    </div>

    <button type="button" class="engine-trigger" id="engineTrigger"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="engineListbox">
      <span id="engineTriggerLabel">Google</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>

    <button type="submit" class="search-bar__submit" id="submitButton" aria-label="Lancer la recherche">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7.5"/>
        <line x1="20.5" y1="20.5" x2="16.4" y2="16.4"/>
      </svg>
    </button>
  </div>

  <ul class="engine-listbox" id="engineListbox" role="listbox" aria-label="Moteur de recherche" tabindex="-1">
    <li role="option" id="opt-google" class="engine-option" data-engine="google" aria-selected="true">Google</li>
    <li role="option" id="opt-bing" class="engine-option" data-engine="bing" aria-selected="false">Bing</li>
    <li role="option" id="opt-ecosia" class="engine-option" data-engine="ecosia" aria-selected="false">Ecosia</li>
  </ul>

  <p class="sr-only" role="status" id="engineAnnouncement">
    Moteur sélectionné : Google. La recherche s'ouvrira dans un nouvel onglet, sans transmettre l'adresse de ce site.
  </p>
</form>

<script>
(function () {
  "use strict";

  // Whitelist stricte, indexée par clé opaque (pas par URL) : même si le DOM
  // était manipulé (extension, devtools, injection future d'options), seule
  // une valeur de cette liste peut être utilisée pour construire l'URL cible.
  var SEARCH_ENGINES = Object.freeze({
    google: { base: "https://www.google.com/search", label: "Google" },
    bing:   { base: "https://www.bing.com/search",   label: "Bing" },
    ecosia: { base: "https://www.ecosia.org/search", label: "Ecosia" }
  });

  var MAX_QUERY_LENGTH = 200;

  var form = document.getElementById("webSearchForm");
  var input = document.getElementById("searchInput");
  var submitButton = document.getElementById("submitButton");
  var trigger = document.getElementById("engineTrigger");
  var triggerLabel = document.getElementById("engineTriggerLabel");
  var listbox = document.getElementById("engineListbox");
  var options = Array.prototype.slice.call(listbox.querySelectorAll('[role="option"]'));
  var announcement = document.getElementById("engineAnnouncement");

  var selectedKey = "google";
  var focusedIndex = 0;

  function keyOf(option) { return option.getAttribute("data-engine"); }

  function positionListbox() {
    // Aligne la liste sous le déclencheur, quelle que soit sa largeur réelle
    // (dépend de la police chargée) plutôt qu'une valeur figée en dur.
    listbox.style.left = trigger.offsetLeft + "px";
    listbox.style.width = trigger.offsetWidth + "px";
  }

  function isOpen() { return listbox.classList.contains("is-open"); }

  function openListbox() {
    positionListbox();
    listbox.classList.add("is-open");
    trigger.setAttribute("aria-expanded", "true");
    focusedIndex = options.findIndex(function (o) { return keyOf(o) === selectedKey; });
    highlightFocused();
    // La liste passe de visibility:hidden à visible via une transition CSS ;
    // on laisse le navigateur poser cette frame avant de tenter le focus,
    // plutôt que de dépendre du timing exact du changement de style.
    requestAnimationFrame(function () { listbox.focus(); });
  }

  function closeListbox(returnFocus) {
    listbox.classList.remove("is-open");
    trigger.setAttribute("aria-expanded", "false");
    if (returnFocus) trigger.focus();
  }

  function highlightFocused() {
    options.forEach(function (o, i) {
      o.classList.toggle("is-focused", i === focusedIndex);
    });
    listbox.setAttribute("aria-activedescendant", options[focusedIndex].id);
  }

  function selectEngine(key) {
    var entry = SEARCH_ENGINES[key];
    if (!entry) return;
    selectedKey = key;
    options.forEach(function (o) {
      o.setAttribute("aria-selected", keyOf(o) === key ? "true" : "false");
    });
    triggerLabel.textContent = entry.label;
    announcement.textContent = "Moteur sélectionné : " + entry.label + ". La recherche s'ouvrira dans un nouvel onglet, sans transmettre l'adresse de ce site.";
  }

  trigger.addEventListener("click", function () {
    if (!isOpen()) openListbox(); else closeListbox(false);
  });

  trigger.addEventListener("keydown", function (event) {
    if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openListbox();
    }
  });

  listbox.addEventListener("keydown", function (event) {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      focusedIndex = (focusedIndex + 1) % options.length;
      highlightFocused();
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      focusedIndex = (focusedIndex - 1 + options.length) % options.length;
      highlightFocused();
    } else if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      selectEngine(keyOf(options[focusedIndex]));
      closeListbox(true);
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeListbox(true);
    } else if (event.key === "Tab") {
      closeListbox(false);
    }
  });

  options.forEach(function (option) {
    option.addEventListener("click", function () {
      selectEngine(keyOf(option));
      closeListbox(true);
    });
    option.addEventListener("mouseenter", function () {
      focusedIndex = options.indexOf(option);
      highlightFocused();
    });
  });

  document.addEventListener("click", function (event) {
    if (isOpen() && !form.contains(event.target)) closeListbox(false);
  });

  window.addEventListener("resize", function () {
    if (isOpen()) positionListbox();
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    var entry = SEARCH_ENGINES[selectedKey];
    // Le moteur doit exister dans la whitelist : sinon on abandonne plutôt
    // que de deviner une URL.
    if (!entry) return;

    var query = input.value.trim().slice(0, MAX_QUERY_LENGTH);
    if (!query) {
      input.focus();
      return;
    }

    // Petit retour au clic (anneau + loupe qui "déclenche"). On repart de
    // zéro à chaque soumission (y compris rapprochées) via un reflow forcé,
    // sinon la classe déjà présente empêcherait l'animation de rejouer.
    submitButton.classList.remove("is-firing");
    void submitButton.offsetWidth;
    submitButton.classList.add("is-firing");
    setTimeout(function () { submitButton.classList.remove("is-firing"); }, 500);

    // Construction via l'API URL (pas de concaténation de chaînes) :
    // l'encodage du paramètre est délégué au navigateur, ce qui évite
    // toute injection dans l'URL finale.
    var url = new URL(entry.base);
    url.searchParams.set("q", query);

    // Ouverture sécurisée, légèrement différée :
    // - target="_blank" + rel="noopener noreferrer" empêche la page ouverte
    //   d'accéder à window.opener (protection contre le "reverse tabnabbing")
    //   et empêche l'URL du site d'être transmise en Referer au moteur cible.
    // - passer par un <a> réel plutôt que window.open(url, '_blank') garantit
    //   que ces attributs sont bien respectés par le navigateur.
    // - le nouvel onglet prend le focus dès son ouverture : sans ce délai,
    //   cet onglet passe en arrière-plan avant que l'animation ait pu
    //   s'afficher. 180ms reste largement dans la fenêtre d'activation
    //   utilisateur (donc pas bloqué comme pop-up) et laisse le temps de
    //   voir le retour visuel.
    setTimeout(function () {
      var link = document.createElement("a");
      link.href = url.toString();
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.click();
    }, 180);
  });
})();
</script>

</body>
</html>
