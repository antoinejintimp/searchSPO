<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Recherche web — Les Résidences de l’Orléanais</title>
<style>
:root{--petrol:#003b4f;--cyan:#00ace7;--muted:#5c727a;--line:#dce7ea;--paper:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:14px;font-family:"Segoe UI",Arial,sans-serif;color:var(--petrol)}
.search{width:100%;max-width:940px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:40px;box-shadow:0 5px 18px #003b4f12;transition:border-color .18s,box-shadow .18s}
.search:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px #00ace724,0 5px 18px #003b4f12}
.field{min-width:0;display:flex;align-items:center;gap:13px;padding-left:16px}
.field>svg{width:23px;height:23px;flex:none;color:var(--cyan)}
input[type=search]{min-width:0;width:100%;border:0;background:transparent;font:400 16px/1.4 "Segoe UI",Arial,sans-serif;color:var(--petrol);outline:none;height:48px}
input::placeholder{color:var(--muted);opacity:1}
.engines{border:0;margin:0;padding:4px;display:flex;gap:2px;background:#f1f6f7;border-radius:24px;min-width:0}
.engine{position:relative;cursor:pointer}
.engine input{position:absolute;width:1px;height:1px;opacity:0}
.engine span{display:flex;align-items:center;justify-content:center;height:38px;padding:0 13px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);transition:background .18s,color .18s}
.engine input:checked+span{background:var(--petrol);color:white;box-shadow:0 2px 4px #003b4f18}
.engine input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:2px}
.submit{border:0;border-radius:28px;background:var(--petrol);color:white;display:flex;align-items:center;justify-content:center;gap:12px;height:50px;padding:0 10px 0 21px;font:600 14px "Segoe UI",Arial,sans-serif;cursor:pointer;transition:background .18s,transform .18s}
.submit:hover{background:#00566d}.submit:active{transform:scale(.98)}
.submit:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.submit svg{width:32px;height:32px;background:var(--cyan);border-radius:50%;padding:7px;color:var(--petrol)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:690px){
.search{grid-template-columns:minmax(0,1fr) auto;border-radius:24px;padding:8px;gap:6px}
.field{padding-left:10px;gap:10px}
.engines{grid-column:1/-1;grid-row:2;justify-content:center;background:transparent;border-top:1px solid #edf2f4;border-radius:0;padding:7px 0 0}
.engine{flex:1;max-width:140px}.engine span{height:36px}
.submit{grid-column:2;grid-row:1;width:48px;height:48px;padding:0}.submit span{display:none}.submit svg{background:transparent;color:white;width:25px;height:25px;padding:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(forced-colors:active){.engine input:checked+span{border:2px solid Highlight}.search,.submit{border:1px solid ButtonText}}
</style>
</head>
<body>
<form class="search" role="search" aria-label="Recherche sur le web" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" autocomplete="off">
<div class="field">
<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
<label class="sr-only" for="query">Que recherchez-vous sur le web ?</label>
<input id="query" type="search" name="q" placeholder="Rechercher sur le web…" required maxlength="200" enterkeyhint="search" aria-describedby="search-help">
</div>
<fieldset class="engines">
<legend class="sr-only">Moteur de recherche</legend>
<label class="engine"><input type="radio" name="engine" value="google" checked><span>Google</span></label>
<label class="engine"><input type="radio" name="engine" value="bing"><span>Bing</span></label>
<label class="engine"><input type="radio" name="engine" value="ecosia"><span>Ecosia</span></label>
</fieldset>
<button class="submit" type="submit" aria-label="Rechercher sur le web — nouvel onglet"><span>Rechercher</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
<p id="search-help" class="sr-only">Les résultats s’ouvrent dans un nouvel onglet sur le moteur choisi. Cette barre recherche sur le web.</p>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
</form>
<script>
'use strict';
const endpoints=Object.freeze({google:'https://www.google.com/search',bing:'https://www.bing.com/search',ecosia:'https://www.ecosia.org/search'});
const form=document.querySelector('form'),query=document.querySelector('#query');
for(const radio of form.querySelectorAll('[name=engine]'))radio.addEventListener('change',()=>{
 const key=form.querySelector('[name=engine]:checked').value;
 if(Object.hasOwn(endpoints,key))form.action=endpoints[key];
 document.querySelector('#status').textContent='Moteur sélectionné : '+radio.nextElementSibling.textContent;
});
query.addEventListener('input',()=>query.setCustomValidity(''));
form.addEventListener('submit',event=>{
 const key=form.querySelector('[name=engine]:checked')?.value;
 if(!Object.hasOwn(endpoints,key)){event.preventDefault();return;}
 query.value=query.value.trim();
 if(!query.value){event.preventDefault();query.setCustomValidity('Saisissez votre recherche.');query.reportValidity();query.focus();return;}
 form.action=endpoints[key];
});
// Les boutons radio restent accessibles, mais seul le paramètre q est envoyé.
form.addEventListener('formdata',event=>event.formData.delete('engine'));
</script>
</body>
</html>
