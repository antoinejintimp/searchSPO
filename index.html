<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: transparent;
}

.search-block {
  max-width: 560px;
}

.search-label {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #111;
  margin-bottom: 6px;
}

.search-underline {
  width: 48px;
  height: 4px;
  background: #111;
  margin-bottom: 16px;
}

.search-widget {
  display: flex;
  align-items: stretch;
  height: 48px;
  background: #ffffff;
  border: 2px solid #111;
  padding-left: 18px;
  transition: box-shadow 0.2s ease;
}

.search-widget:focus-within {
  box-shadow: 4px 4px 0px #c4f000;
}

.search-icon {
  color: #111;
  flex-shrink: 0;
  align-self: center;
  margin-right: 10px;
}

#searchInput {
  flex: 1;
  border: none;
  outline: none;
  font-size: 15px;
  background: transparent;
  color: #111;
}

#searchInput::placeholder {
  color: #999;
}

.engine-select-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  border-left: 1px solid #ddd;
  padding: 0 12px;
}

#engineSelect {
  border: none;
  outline: none;
  background: transparent;
  font-size: 12px;
  color: #555;
  padding-right: 16px;
  appearance: none;
  cursor: pointer;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.engine-select-wrapper::after {
  content: '';
  position: absolute;
  right: 12px;
  top: 50%;
  width: 6px;
  height: 6px;
  border-right: 1.5px solid #999;
  border-bottom: 1.5px solid #999;
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

button[type="submit"] {
  border: none;
  background: #c4f000;
  color: #111;
  width: 48px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease;
}

button[type="submit"]:hover {
  background: #a8d000;
}

button[type="submit"] svg {
  width: 18px;
  height: 18px;
}
</style>
</head>
<body>

<div class="search-block">
  <div class="search-label">Rechercher</div>
  <div class="search-underline"></div>
  <form id="webSearchForm" class="search-widget">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Rechercher sur le web..." required />
    <div class="engine-select-wrapper">
      <select id="engineSelect">
        <option value="https://www.google.com/search?q=">Google</option>
        <option value="https://www.bing.com/search?q=">Bing</option>
        <option value="https://www.ecosia.org/search?q=">Ecosia</option>
      </select>
    </div>
    <button type="submit" aria-label="Rechercher">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </form>
</div>

<script>
document.getElementById('webSearchForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const baseUrl = document.getElementById('engineSelect').value;
  const query = document.getElementById('searchInput').value;
  window.open(baseUrl + encodeURIComponent(query), '_blank');
});
</script>

</body>
</html>
